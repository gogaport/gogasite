<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Скины для osu! — gogaportwine</title>

<!-- Open Graph -->
<meta property="og:type" content="website">
<meta property="og:url" content="https://gogaportwine.online/skins/">
<meta property="og:title" content="Скины для osu! — gogaportwine">
<meta property="og:description" content="Скины для osu! — Rafis, Cookiezi, WhiteCat. Скачать .osk.">
<meta property="og:image" content="https://gogaportwine.online/avatar.jpg">
<meta name="theme-color" content="#09090b">

<!-- Favicon -->
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="alternate icon" href="../favicon.ico">

<!-- Shared Stylesheet -->
<link rel="stylesheet" href="../style.css">

<style>
  body {
    padding: 32px 16px 48px;
  }

  .container {
    max-width: 760px;
    gap: 20px;
  }

  .back-link {
    font-size: 12.5px;
    font-family: var(--font-mono);
    color: var(--fg-muted);
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 4px 8px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 6px;
    width: fit-content;
  }
  .back-link:hover {
    color: #fff;
    border-color: var(--border-hover);
    text-decoration: none;
  }

  .header h1 {
    font-size: 18px;
    font-weight: 600;
    color: var(--fg);
    letter-spacing: -0.01em;
  }
  .header p {
    font-size: 13px;
    color: var(--fg-muted);
    margin-top: 2px;
  }

  .bar {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
  }
  .search-input {
    flex: 1;
    min-width: 200px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--fg);
    padding: 6px 10px;
    font-size: 13px;
    font-family: var(--font);
    outline: none;
  }
  .search-input:focus {
    border-color: var(--border-hover);
  }

  .chips {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
  }
  .chip {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--fg-muted);
    border-radius: 6px;
    padding: 5px 10px;
    font-size: 12px;
    font-family: var(--font-mono);
    cursor: pointer;
  }
  .chip:hover {
    color: #fff;
    border-color: var(--border-hover);
  }
  .chip.active {
    background: var(--fg);
    color: var(--bg);
    border-color: var(--fg);
    font-weight: 600;
  }

  /* Grid */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 12px;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    transition: border-color 140ms var(--ease);
  }
  .card:hover {
    border-color: var(--border-hover);
  }

  .preview {
    aspect-ratio: 16 / 9;
    position: relative;
    display: grid;
    place-items: center;
    background: #000 center / cover no-repeat;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
  }
  .preview:hover::after {
    content: "Увеличить";
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.6);
    color: #fff;
    font-size: 11.5px;
    font-family: var(--font-mono);
    display: grid;
    place-items: center;
  }

  .mode-tag {
    position: absolute;
    top: 6px;
    left: 6px;
    border: 1px solid var(--border);
    background: rgba(9, 9, 11, 0.85);
    color: var(--fg-muted);
    font-size: 10px;
    font-family: var(--font-mono);
    padding: 1px 5px;
    border-radius: 4px;
    text-transform: uppercase;
  }

  .fav-badge {
    position: absolute;
    top: 6px;
    right: 6px;
    background: #18181b;
    border: 1px solid #3f3f46;
    color: #fbbf24;
    font-size: 10.5px;
    font-family: var(--font-mono);
    padding: 1px 6px;
    border-radius: 4px;
    font-weight: 500;
  }

  .info {
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    flex: 1;
    gap: 2px;
  }
  .info h3 {
    font-size: 13.5px;
    font-weight: 600;
    color: var(--fg);
  }
  .meta {
    color: var(--fg-muted);
    font-size: 12px;
    margin-bottom: 10px;
  }

  .card .btn {
    padding: 6px 10px;
    margin-top: auto;
  }

  .empty {
    color: var(--fg-muted);
    grid-column: 1 / -1;
    text-align: center;
    padding: 32px 0;
    font-size: 13px;
  }

  /* Lightbox */
  .lightbox {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.85);
    z-index: 1000;
    display: none;
    place-items: center;
    padding: 16px;
    cursor: zoom-out;
  }
  .lightbox.active {
    display: grid;
  }
  .lightbox img {
    max-width: 95vw;
    max-height: 90vh;
    border-radius: 6px;
    border: 1px solid var(--border);
    object-fit: contain;
  }

  footer {
    padding-top: 16px;
    font-size: 11.5px;
    text-align: center;
  }
</style>
</head>
<body>

<div class="container">
  <div>
    <a class="back-link" href="../">← gogaportwine.online</a>
  </div>

  <header class="header" style="display: flex; align-items: center; gap: 14px;">
    <img src="../icons/osu.png" width="44" height="44" alt="osu!" style="border-radius: 50%; flex-shrink: 0;">
    <div>
      <h1 style="margin: 0;">Скины для osu!</h1>
      <p style="margin: 2px 0 0 0;">Юзабельные и популярные скины для осу на все случаи жизни. Скачай .osk и открой файл — osu! установит скин автоматически.</p>
    </div>
  </header>

  <div class="bar">
    <input class="search-input" id="q" placeholder="Поиск по названию или автору…">
    <div class="chips" id="filters"></div>
  </div>

  <section class="grid" id="skins"></section>

  <footer>
    Не связано с ppy Pty Ltd. Все скины принадлежат их авторам.
  </footer>
</div>

<!-- Lightbox Modal -->
<div class="lightbox" id="lightbox">
  <img id="lightbox-img" src="" alt="Skin Preview">
</div>

<script>
  const skins = [
    {
      name: "emo",
      author: "cryshina",
      mode: "standard",
      image: "previews/emo.jpg",
      file: "files/emo.osk",
      favorite: true
    },
    {
      name: "Rafis HDDT",
      author: "Rafis",
      mode: "standard",
      image: "previews/rafis.jpg",
      file: "https://github.com/gogaport/osuskinsgoga/releases/download/skin-rafis/Rafis_2018-03-26_HDDT_John_edit.osk"
    },
    {
      name: "Cookiezi Shigetora",
      author: "Cookiezi",
      mode: "standard",
      image: "previews/cookiezi.jpg",
      file: "https://github.com/gogaport/osuskinsgoga/releases/download/skin-cookiezi/Cookiezi.36.2018-11-23.Rafis.Edit.osk"
    },
    {
      name: "WhiteCat 2.1",
      author: "WhiteCat",
      mode: "standard",
      image: "previews/whitecat.jpg",
      file: "https://github.com/gogaport/osuskinsgoga/releases/download/skin-whitecat/WhiteCat.2.1.osk"
    }
  ];

  const modes = ["все", "standard", "taiko", "catch", "mania"];
  let mode = "все";
  const f = document.getElementById("filters");
  const q = document.getElementById("q");
  const container = document.getElementById("skins");
  const lightbox = document.getElementById("lightbox");
  const lightboxImg = document.getElementById("lightbox-img");

  f.innerHTML = modes.map(m => `<button class="chip${m === mode ? " active" : ""}" data-m="${m}">${m}</button>`).join("");
  
  f.onclick = (e) => {
    if (!e.target.dataset.m) return;
    mode = e.target.dataset.m;
    f.querySelectorAll(".chip").forEach(c => c.classList.toggle("active", c.dataset.m === mode));
    render();
  };

  q.oninput = render;

  function openLightbox(src) {
    if (!src) return;
    lightboxImg.src = src;
    lightbox.classList.add("active");
  }

  lightbox.onclick = () => {
    lightbox.classList.remove("active");
  };

  window.addEventListener("keydown", (e) => {
    if (e.key === "Escape") lightbox.classList.remove("active");
  });

  function render() {
    const s = q.value.toLowerCase().trim();
    const list = skins.filter(k => (mode === "все" || k.mode === mode) && (k.name + " " + k.author).toLowerCase().includes(s));
    
    container.innerHTML = list.length ? list.map((k, i) => `
      <article class="card">
        <div class="preview" ${k.image ? `style="background-image:url('${k.image}')"` : ""} onclick="openLightbox('${k.image || ""}')">
          <span class="mode-tag">${k.mode}</span>
          ${k.favorite ? `<span class="fav-badge">★ фаворит</span>` : ""}
        </div>
        <div class="info">
          <h3>${k.name}</h3>
          <div class="meta">by ${k.author}</div>
          ${k.file && k.file !== "#" 
            ? `<a class="btn" href="${k.file}">Скачать .osk</a>` 
            : `<span class="btn off">Скоро</span>`}
        </div>
      </article>
    `).join("") : `<p class="empty">Ничего не найдено</p>`;
  }

  render();
</script>
</body>
</html>
